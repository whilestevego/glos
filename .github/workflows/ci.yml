name: CI

on:
  pull_request:
  push:
    branches: [main]

# On a pull request, a new push cancels the run for the older commit. On main, each commit gets
# its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The toolchain comes from rust-toolchain.toml, which rustup on the runner reads. A newer clippy
# adds lints, so CI must not float on stable. Vale comes from cargo xtask, at the version and
# SHA-256 pinned in xtask/src/vale.rs.
#
# Actions are pinned to commit SHAs, because a version tag can be moved to other code.
# Dependabot keeps them up to date.
jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The prose lint needs the history back to the merge base. Nothing pushes, so the token
      # is not kept in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo xtask ci origin/main
