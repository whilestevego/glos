version: 2

updates:
  # The workflow pins each action to a commit SHA. Dependabot updates the SHA and the version
  # comment after it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
