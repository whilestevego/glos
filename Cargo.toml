[package]
name = "glos"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
etcetera = "0.10"
gix = "0.90.0"
globset = "0.4.21"
helix-core = { git = "https://github.com/helix-editor/helix", tag = "25.07.1", version = "25.7.1" }
helix-stdx = { git = "https://github.com/helix-editor/helix", tag = "25.07.1", version = "25.7.1" }
ignore = "0.4.34"
imara-diff = "0.2"
libc = "0.2.191"
nucleo = "0.5"
ratatui = "0.30.2"
regex = "1.13.1"
ropey = "1.6.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tree-house = { version = "=0.3.0", default-features = false }
tree-house-bindings = { version = "0.2.4", features = ["tree-sitter-language"] }
tree-sitter-language = "0.1"
unicode-width = "0.2.3"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

# gix is very slow unoptimised (a 1.2 s scan takes 24 s); optimise dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
cc = "1.11.0"
