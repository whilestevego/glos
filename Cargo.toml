[workspace]
members = ["crates/glos-helix"]

[package]
name = "glos"
version = "0.1.0"
edition = "2024"

[dependencies]
glos-helix = { path = "crates/glos-helix" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
crossterm = "0.29.0"
etcetera = "0.10"
gix = "0.90.0"
globset = "0.4.21"
ignore = "0.4.34"
imara-diff = "0.2"
jiff = "0.2"
libc = "0.2.191"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
nucleo = "0.5"
ratatui = "0.30.2"
regex = "1.13.1"
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.3"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

# gix is very slow unoptimised (a 1.2 s scan takes 24 s); optimise dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 2

